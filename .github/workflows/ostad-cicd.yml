name: CICD Pipeline 

on:
  push:
    branches:
      - main



jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Git Clone 
        uses: actions/checkout@v7

      - name: install node js 
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      
      - name: Install Packages
        run: npm install 

      - name: Run the Test 
        run: npm run test > test.txt

      - name: Upload the Artifact 
        uses: actions/upload-artifact@v7
        with:
          path: ./test.txt
          
      - name: Print The Hello.txt file
        run: cat hello.txt





  Deploy:
    runs-on: ubuntu-latest 
    needs: Test 

    steps:
      - name: Connect To the Server.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ vars.PORT }}
          script: |
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/ostad
            cd /home/ubuntu/CICD-OSTAD
            git pull 
            npm install 
            pm2 restart 0
            sudo systemctl restart nginx 




