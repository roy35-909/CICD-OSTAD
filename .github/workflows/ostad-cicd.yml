name: CICD Pipeline 

on:
  push:
    branches:
      - main



jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Git Clone 
        uses: actions/checkout@v7

      - name: install node js 
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      
      - name: Install Packages
        run: npm install 

      - name: Run the Test 
        run: npm run test 

      - name: Print The Hello.txt file
        run: cat hello.txt

  Deploy:

    runs-on: ubuntu-latest 
    needs: Test

    steps:
      - name: SSH Commands 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ vars.PORT }}
          script: |
            sudo apt update
            pwd
            whoami
            cd ~
            mkdir ostad
